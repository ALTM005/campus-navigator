<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SearchMyCampus</title>
  <style>
    :root{
      --brand:#043927;
      --brand-2:#00573f;
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#1b1b1b;
      --muted:#6b7280;
      --ring:#94d3ac;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Poppins',sans-serif;margin:0;background-color:var(--bg);color:var(--text)}

    /* Top site header */
    header.site{
      display:flex;justify-content:space-between;align-items:center;gap:16px;
      background-color:var(--brand);color:#fff;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20
    }
    .left-section{display:flex;align-items:center;gap:10px}
    .left-section img{height:60px;width:auto;border-radius:5px}
    .left-section h1{font-size:1.8rem;margin:0;color:#fff;white-space:nowrap}

    #controls{flex:1;min-width:320px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
    #searchInput{
      width:100%;padding:10px 12px;border:2px solid #d1d5db;border-radius:10px;font-size:1rem;background:#fff;color:#222;
      outline:none
    }
    #searchInput:focus{border-color:var(--ring);box-shadow:0 0 0 4px rgba(17,179,94,.15)}
    .btn{padding:10px 14px;border:none;border-radius:8px;background:var(--brand-2);color:#fff;font-weight:600;cursor:pointer}
    .btn:hover{background:#007a55}
    .btn.secondary{background:#1f2937}
    .btn.secondary:hover{background:#374151}

    #suggestions{
      position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-top:6px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden;max-height:280px;overflow-y:auto;z-index:30;display:none
    }
    #suggestions[aria-expanded="true"]{display:block}
    .sugg-item{padding:10px 12px;cursor:pointer}
    .sugg-item[aria-selected="true"], .sugg-item:hover{background:#f3f4f6}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .chip{background:#e5efe9;color:#0f5132;padding:6px 10px;border-radius:999px;font-size:.85rem;cursor:pointer}

    /* Status bar */
    #statusBar{
      width:90%;max-width:1100px;margin:14px auto 0 auto;background:#ffffff;border:1px solid #e5e7eb;
      border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04);color:#111
    }

    #map{
      height:520px;width:90%;margin:12px auto;border-radius:15px;background:#eaeaea;
      box-shadow:0 0 10px rgba(0,0,0,.1)
    }

    /* Dashboard: Resources + Events */
    #dashboard{
      width:90%;max-width:1100px;margin:14px auto 28px auto;display:grid;gap:16px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 900px){
      #dashboard{ grid-template-columns: 1fr; }
    }
    .card{
      background:var(--card);border-radius:12px;border:1px solid #e5e7eb;
      box-shadow:0 4px 12px rgba(0,0,0,.06);padding:16px
    }
    .card h2{ margin:0 0 10px; color:var(--brand); font-size:1.25rem; }
    .list{ list-style:none; padding:0; margin:0; display:grid; gap:10px; }

    /* Clickable link cards */
    .link-card{
      display:block; text-decoration:none; color:inherit;
      border:1px solid #e5e7eb; border-radius:10px; background:#fff; padding:10px 12px;
      transition:background .15s ease, border-color .15s ease, transform .05s ease;
    }
    .link-card:hover{ background:#f9fafb; border-color:#d1d5db; }
    .link-card:active{ transform:scale(0.995); }

    .item .title{ font-weight:700; }
    .item .meta{ color:#374151; font-size:.95rem; }
    .item .where{ color:#111827; font-size:.95rem; }

    .muted{color:var(--muted);font-size:.9rem}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* --- Dept side panel --- */
    #deptBackdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.25);
      opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:39;
    }
    #deptBackdrop.open{ opacity:1; pointer-events:auto; }

    #deptPanel{
      position:fixed; top:0; right:-380px; height:100vh; width:360px;
      background:#fff; box-shadow:-12px 0 32px rgba(0,0,0,.15);
      transition:right .25s ease; z-index:40; display:flex; flex-direction:column;
      border-left:1px solid #e5e7eb; color:#111;
    }
    #deptPanel.open{ right:0; }
    #deptPanel header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid #e5e7eb; background:#f9fafb; color:#111;
    }
    #deptPanel h3{ margin:0; font-size:1.05rem; color:#111; }
    #deptPanel .closeBtn{
      border:none; background:#1f2937; color:#fff; border-radius:8px; padding:8px 10px; cursor:pointer;
    }
    #deptPanel .closeBtn:hover{ background:#374151; }
    #deptPanel .content{ padding:12px 16px; overflow:auto; }

    /* Panel list items */
    #deptPanel ul{ list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    #deptPanel li{ border:1px solid #e5e7eb; border-radius:10px; background:#fff; }

    /* Grouped-by-floor styling */
    #deptPanel .floor-group{ margin:12px 0 16px; }
    #deptPanel .floor-title{ margin:6px 0 8px; font-weight:700; color:var(--brand); }
    #deptPanel .floor-group ul{ list-style:none; padding:0; margin:0; display:grid; gap:8px; }

    /* Detail card (when searching a department/office) */
    #deptPanel .detail-card{
      border:1px solid #e5e7eb; border-radius:12px; background:#f8faf9;
      padding:12px 14px; margin:0 0 12px 0;
    }
    #deptPanel .detail-title{ font-weight:700; margin:0 0 6px; }
    #deptPanel .detail-sub{ color:#374151; margin:0 0 6px; }
    #deptPanel .detail-hours{ color:#111827; }

    /* Accordion styling for department items */
    details.dept{
      border:1px solid #e5e7eb; border-radius:10px; background:#fff;
    }
    details.dept[open]{ background:#f9fafb; }
    details.dept > summary{
      cursor:pointer; list-style:none; padding:10px 12px; font-weight:600;
      display:flex; align-items:center; justify-content:space-between;
    }
    details.dept > summary::marker{ display:none; }
    details.dept > .dept-body{
      padding:10px 12px; border-top:1px dashed #e5e7eb; color:#1f2937;
      font-size:0.95rem;
    }
    .chev{transition:transform .15s ease}
    details[open] .chev{ transform:rotate(90deg); }
    .hint{ color:#6b7280; font-weight:500; font-size:.9rem; }

    /* Chooser list buttons */
    .chooser-list{ display:grid; gap:8px; padding:0; margin:0; list-style:none; }
    .chooser-item{ border:1px solid #e5e7eb; border-radius:10px; background:#fff; padding:10px 12px; cursor:pointer; }
    .chooser-item:hover{ background:#f9fafb; }
    .chooser-title{ font-weight:700; }
    .chooser-sub{ color:#374151; font-size:.95rem; }
  </style>
</head>

      "CCE Dean’s Office": { hours:"Mon–Fri: 8:00 AM – 5:00 PM", phone:"(916) 278-XXXX", note:"Dean’s administration for Continuing Education." },

      "Department of Electrical & Electronic Engineering": { hours:"Mon–Fri: 9:00 AM – 4:30 PM", phone:"(916) 278-XXXX", note:"Office support, faculty mailboxes, lab access coordination." },
      "Department of Computer Engineering": { hours:"Mon–Fri: 9:00 AM – 4:30 PM", phone:"(916) 278-XXXX", note:"Undergraduate advising windows and capstone info." },
      "Department of Computer Science": { hours:"Mon–Fri: 9:00 AM – 4:30 PM", phone:"(916) 278-XXXX", note:"Grad/undergrad office hours; TA schedules vary by semester." },
      "Department of Civil Engineering": { hours:"Mon–Fri: 9:00 AM – 4:00 PM", phone:"(916) 278-XXXX", note:"Project lab reservations and advising sign-ups." },
      "Department of Mechanical Engineering": { hours:"Mon–Fri: 9:00 AM – 4:00 PM", phone:"(916) 278-XXXX", note:"Shop access orientations and safety trainings." },
      "Department of Construction Management": { hours:"Mon–Fri: 9:00 AM – 4:00 PM", phone:"(916) 278-XXXX", note:"Industry partnerships and internship postings." }
    };

    // --------- PANEL RENDERING ----------
    function fillDeptList(buildingTitle, opts = {}){
      const key = (buildingTitle || "").toLowerCase().trim();
      const cfg = departments[key];
      const content = document.querySelector("#deptPanel .content");

      // Special mode: dean chooser
      if (opts.mode === "dean-chooser") {
        const listHTML = deanDirectory.map((o, idx) => {
          return `
            <li class="chooser-item" data-idx="${idx}" role="button" tabindex="0" aria-label="${o.label}">
              <div class="chooser-title">${o.label}</div>
              <div class="chooser-sub">${o.college} — ${titleize(o.buildingKey)}${o.floor ? " • " + o.floor : ""}</div>
            </li>
          `;
        }).join("");
        content.innerHTML = `
          <div class="detail-card">
            <div class="detail-title">Dean’s Offices</div>
            <div class="detail-sub">Select a dean’s office to view its location and details.</div>
          </div>
          <ul class="chooser-list">${listHTML}</ul>
        `;
        content.querySelectorAll(".chooser-item").forEach(el=>{
          el.addEventListener("click", ()=>{
            const idx = parseInt(el.getAttribute("data-idx"), 10);
            const item = deanDirectory[idx];
            if (item) goToDeanOffice(item);
          });
          el.addEventListener("keydown", (e)=>{
            if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); }
          });
        });
        return;
      }

      let detail = "";
      const matchedNorm = opts.matchedDept ? clean(opts.matchedDept) : null;

      if (opts.matchedDept) {
        const loc = `Located in ${buildingTitle}${opts.floor ? " — " + opts.floor : ""}`;
        const hours = opts.hours ? `<div class="detail-hours"><strong>Hours:</strong> ${opts.hours}</div>` : "";
        detail = `
          <div class="detail-card" role="note" aria-label="Office details">
            <div class="detail-title">${opts.matchedDept}</div>
            <div class="detail-sub">${loc}</div>
            ${hours}
          </div>
        `;
      }

      if (!cfg || !(cfg.byFloor || cfg.items || cfg.heading)) {
        content.innerHTML = `${detail}<ul id="deptList"><li class="muted">No department list added yet for this building.</li></ul>`;
        return;
      }

      const headingHTML = cfg.heading ? `<p>${cfg.heading}</p>` : "";

      // Grouped-by-floor (hide matched office if present)
      const floors = Object.keys(cfg.byFloor || {}).sort((a,b) => {
        const na = parseInt(a, 10), nb = parseInt(b, 10);
        return (isNaN(na)?999:na) - (isNaN(nb)?999:nb);
      });

      const sectionsHTML = floors.map(floor => {
        let items = cfg.byFloor[floor] || [];
        if (matchedNorm) items = items.filter(dep => clean(dep) !== matchedNorm);
        if (!items.length) return "";
        const lis = items.map(dep => renderDeptAccordion(dep, floor)).join("");
        return `
          <section class="floor-group" aria-label="${floor}">
            <h4 class="floor-title">${floor} <span class="hint">(tap a department)</span></h4>
            <ul>${lis}</ul>
          </section>
        `;
      }).join("");

      content.innerHTML = `${detail}${headingHTML}${sectionsHTML || `<p class="muted">No other departments listed.</p>`}`;
    }

    function goToDeanOffice(item){
      const key = (item.buildingKey||"").toLowerCase();
      const coords = buildings[key];
      const buildingTitle = titleize(key);

      if (!coords) {
        showStatus(`We don’t have a map location saved for ${buildingTitle} yet.`);
        $("deptPanelTitle").textContent = "Dean’s Offices";
        fillDeptList("Dean’s Offices", { mode:"dean-chooser" });
        return;
      }

      lastDeptContext = { matchedDept: item.label, floor: item.floor, hours: item.hours };
      dropMarkerAt(coords, buildingTitle);
      showStatus(`${item.label}${item.floor? " — "+item.floor:""} is in ${buildingTitle}.`);
      saveRecent(item.label);
      listMatchesAround(coords, key);
    }

    function renderDeptAccordion(depLabel, floor){
      const info = departmentDetails[depLabel] || {};
      const hours = info.hours ? `<div><strong>Hours:</strong> ${info.hours}</div>` : `<div><strong>Hours:</strong> Mon–Fri: 9:00 AM – 5:00 PM</div>`;
      const phone = info.phone ? `<div><strong>Phone:</strong> ${info.phone}</div>` : "";
      const note  = info.note  ? `<div>${info.note}</div>` : "";
      const floorText = floor ? `<div><strong>Floor:</strong> ${floor}</div>` : "";
      const chev = `<svg class="chev" width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 6l6 4-6 4V6z" stroke="currentColor"/></svg>`;

      return `
        <li>
          <details class="dept">
            <summary>${depLabel}<span aria-hidden="true">${chev}</span></summary>
            <div class="dept-body">
              ${floorText}
              ${hours}
              ${phone}
              ${note}
            </div>
          </details>
        </li>
      `;
    }

    function openDeptPanel(buildingTitle, opts = {}){
      $("deptPanelTitle").textContent = buildingTitle;
      fillDeptList(buildingTitle, opts);
      $("deptPanel").classList.add("open");
      $("deptBackdrop").classList.add("open");
      $("deptPanel").setAttribute("aria-hidden","false");
      $("deptBackdrop").setAttribute("aria-hidden","false");
    }

    function closeDeptPanel(){
      $("deptPanel").classList.remove("open");
      $("deptBackdrop").classList.remove("open");
      $("deptPanel").setAttribute("aria-hidden","true");
      $("deptBackdrop").setAttribute("aria-hidden","true");
    }

    // Close handlers
    $("deptBackdrop").addEventListener("click", closeDeptPanel);
    $("deptCloseBtn").addEventListener("click", closeDeptPanel);
    window.addEventListener("keydown", e => { if(e.key === "Escape") closeDeptPanel(); });

    // -------- Reverse lookup: department/office -> building --------
    function findBuildingByDepartment(query){
      const q = clean(query);
      if(!q) return null;

      // generic dean search -> chooser
      const isGenericDean = /\bdean'?s?\b/.test(q) && /\boffice\b/.test(q) &&
        !/\b(ecs|engineering|business|cob|nsm|science|mathematics|arts|letters|education|hhs|ssis|cce)\b/.test(q);
      if (isGenericDean) return { mode: "dean-chooser" };

      // prefer explicit matches
      let best = null, bestScore = 0;
      for (const [key, meta] of Object.entries(departmentIndex)) {
        const s = score(q, clean(key));
        if (s > 0.7 && s > bestScore) {
          bestScore = s;
          best = { buildingKey: meta.buildingKey, floor: meta.floor, matchLabel: meta.display || key, hours: meta.hours, score: s };
        }
      }
      if (best) return best;

      // fallback fuzzy against departments list
      for(const [bKey, cfg] of Object.entries(departments)){
        if(!cfg) continue;
        const candidates = [];
        if (cfg.heading){
          const headingText = cfg.heading.replace(/<[^>]+>/g,'');
          candidates.push({ label: headingText, floor: null });
        }
        if (cfg.items){ cfg.items.forEach(name => candidates.push({ label: name, floor: null })); }
        if (cfg.byFloor){
          for(const [floor, arr] of Object.entries(cfg.byFloor)){
            (arr || []).forEach(name => candidates.push({ label: name, floor }));
          }
        }
        let bestLocal = null, bestLocalScore = 0;
        for(const cand of candidates){
          const s = score(q, clean(cand.label));
          if (s > 0.62 && s > bestLocalScore){
            bestLocalScore = s;
            bestLocal = { buildingKey: bKey, floor: cand.floor, matchLabel: cand.label, score: s };
          }
        }
        if (bestLocal) return bestLocal;
      }
      return null;
    }

    // --- Map / UI helpers ---
    function dropMarkerAt(pos, title) {
      if (marker) marker.setMap(null);
      marker = new google.maps.Marker({ position: pos, map, title });
      map.panTo(pos);
      map.setZoom(18);

      if (lastDeptContext && lastDeptContext.matchedDept) {
        const floorText = lastDeptContext.floor ? ` — ${lastDeptContext.floor}` : "";
        showStatus(`${lastDeptContext.matchedDept}${floorText} @ ${title}`);
      } else {
        showStatus(title);
      }

      openDeptPanel(title, lastDeptContext || {});
      lastDeptContext = null;
    }

    function showStatus(msg){
      const el = $("statusBar");
      if (el) el.textContent = msg;
      const sr = $("buildingInfo");
      if (sr) sr.textContent = msg;
    }

    function metersToHuman(m){ return (m<1000) ? `${Math.round(m)} m` : `${(m/1000).toFixed(2)} km`; }
    function distanceBetween(a,b){
      const p1 = new google.maps.LatLng(a.lat, a.lng);
      const p2 = new google.maps.LatLng(b.lat, b.lng);
      return google.maps.geometry.spherical.computeDistanceBetween(p1,p2);
    }

    function saveRecent(term){
      const t = term.trim();
      if(!t) return;
      const rec = JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");
      const next = [t, ...rec.filter(x=>x.toLowerCase()!==t.toLowerCase())].slice(0,6);
      localStorage.setItem(RECENT_KEY, JSON.stringify(next));
      renderRecent();
    }

    function renderRecent(){
      const rec = JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");
      const row = $("recentRow");
      row.innerHTML = "";
      rec.forEach(r=>{
        const chip = document.createElement("button");
        chip.className="chip";
        chip.textContent=r;
        chip.setAttribute("aria-label", `Search ${r}`);
        chip.addEventListener("click", ()=>{
          $("searchInput").value = r;
          doSearch();
        });
        row.appendChild(chip);
      });
    }

    // Levenshtein + scoring
    function levenshtein(a,b){
      a = norm(a); b = norm(b);
      const m = a.length, n = b.length;
      if(!m) return n; if(!n) return m;
      const dp = Array.from({length:n+1}, (_,j)=>j);
      for(let i=1;i<=m;i++){
        let prev = i-1, cur = i;
        for(let j=1;j<=n;j++){
          const cost = a[i-1]===b[j-1]?0:1;
          const next = Math.min(dp[j]+1, cur+1, prev+cost);
          prev = dp[j]; dp[j] = next; cur = next;
        }
        dp[0] = i;
      }
      return dp[n];
    }
    function score(query, candidate){
      const q = norm(query), c = norm(candidate);
      if(!q || !c) return 0;
      if(c===q) return 1.0;
      if(c.startsWith(q)) return 0.95;
      if(c.includes(q)) return 0.85;
      const d = levenshtein(q,c);
      const maxLen = Math.max(q.length,c.length);
      return Math.max(0, 1 - d / maxLen);
    }
    function rankedSuggestions(query){
      const q = norm(query);
      const keys = Object.keys(buildings);
      const ranked = keys.map(k=>({k, s: score(q,k)}))
        .filter(x=>x.s>0.5)
        .sort((a,b)=>b.s-a.s)
        .slice(0,8);
      return ranked.map(x=>x.k);
    }

    // Nearby list (kept but visually hidden)
    function listMatchesAround(pos, queryKey){
      const list = $("resultsList");
      if(!list) return;
      list.innerHTML = "";
      const base = pos || sacCenter;
      const keys = Object.keys(buildings);
      const q = norm(queryKey);
      const filtered = keys.filter(k=> !q || k.includes(q))
        .map(k=>({k, d: distanceBetween(base, buildings[k])}))
        .sort((a,b)=>a.d-b.d)
        .slice(0,6);

      filtered.forEach(({k,d})=>{
        const li = document.createElement("li");
        li.className="result";
        li.setAttribute("tabindex","0");
        li.innerHTML = `<span>${k.replace(/\b\w/g,c=>c.toUpperCase())}</span><span class="muted">${metersToHuman(d)}</span>`;
        li.addEventListener("click", ()=>{
          const {lat,lng} = buildings[k];
          dropMarkerAt({lat,lng}, k.replace(/\b\w/g,c=>c.toUpperCase()));
          saveRecent(k);
        });
        li.addEventListener("keydown", (e)=>{
          if(e.key==="Enter"||e.key===" "){ e.preventDefault(); li.click(); }
        });
        list.appendChild(li);
      });
    }

    // ---------- Map ----------
    function initMap(){
      const appleStyle = [
        { elementType:'geometry', stylers:[{color:'#f5f5f5'}]},
        { elementType:'labels.icon', stylers:[{visibility:'off'}]},
        { elementType:'labels.text.fill', stylers:[{color:'#616161'}]},
        { elementType:'labels.text.stroke', stylers:[{color:'#f5f5f5'}]},
        { featureType:'administrative.land_parcel', stylers:[{visibility:'off'}]},
        { featureType:'poi', stylers:[{visibility:'off'}]},
        { featureType:'road', elementType:'geometry', stylers:[{color:'#ffffff'}]},
        { featureType:'road.highway', elementType:'geometry', stylers:[{color:'#dadada'}]},
        { featureType:'transit', stylers:[{visibility:'off'}]},
        { featureType:'water', elementType:'geometry', stylers:[{color:'#c9e6ff'}]}
      ];

      map = new google.maps.Map($("map"),{
        center:sacCenter,
        zoom:16,
        styles:appleStyle,
        mapTypeControl:false,
        disableDefaultUI:false,
        restriction:{
          latLngBounds:{north:38.568,south:38.551,west:-121.435,east:-121.415},
          strictBounds:false
        }
      });

      const input = $("searchInput");
      const btn = $("searchBtn");
      const locateBtn = $("locateBtn");

      // Suggestions while typing
      let active = -1, currentItems = [];
      input.addEventListener("input", ()=>{
        const val = input.value;
        currentItems = rankedSuggestions(val);
        active = -1;
        renderSuggestions(currentItems);
        listMatchesAround(myLocation || sacCenter, val);
      });

      input.addEventListener("focus", ()=>{
        if(currentItems.length) renderSuggestions(currentItems, active);
      });

      input.addEventListener("blur", ()=>{
        setTimeout(hideSuggestions, 120);
      });

      input.addEventListener("keydown", (e)=>{
        const len = currentItems.length;
        if(!len) return;
        if(e.key==="ArrowDown"){ e.preventDefault(); active = (active+1)%len; renderSuggestions(currentItems, active); }
        else if(e.key==="ArrowUp"){ e.preventDefault(); active = (active-1+len)%len; renderSuggestions(currentItems, active); }
        else if(e.key==="Enter"){
          if(active>=0){ input.value = currentItems[active]; }
          btn.click();
        } else if(e.key==="Escape"){ hideSuggestions(); }
      });

      // Primary search action
      btn.addEventListener("click", doSearch);
      input.addEventListener("keydown", e=>{ if(e.key==="Enter") btn.click(); });

      // Center on me
      locateBtn.addEventListener("click", ()=>{
        if(!navigator.geolocation){
          showStatus("Geolocation not supported by your browser.");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos)=>{
            myLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            dropMarkerAt(myLocation, "My location");
            showStatus("Centered on your location.");
            listMatchesAround(myLocation, norm(input.value));
          },
          (err)=>{
            showStatus("Couldn't get your location. (Grant permission & use HTTPS/localhost.)");
            console.warn(err);
          },
          { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
        );
      });

      // Initial UI
      renderDashboard();
      renderRecent();
      listMatchesAround(sacCenter, "");
    }

    // ---------- Suggestions box ----------
    function renderSuggestions(items, activeIndex=-1){
      const box = $("suggestions");
      box.innerHTML = "";
      if(!items.length){ box.setAttribute("aria-expanded","false"); return; }
      items.forEach((name,i)=>{
        const div = document.createElement("div");
        div.className="sugg-item";
        div.setAttribute("role","option");
        div.setAttribute("id",`sugg-${i}`);
        div.setAttribute("aria-selected", i===activeIndex ? "true" : "false");
        div.textContent = name.replace(/\b\w/g,c=>c.toUpperCase());
        div.addEventListener("mousedown",(e)=>{
          e.preventDefault();
          $("searchInput").value = name;
          doSearch();
          hideSuggestions();
        });
        box.appendChild(div);
      });
      box.setAttribute("aria-expanded","true");
    }
    function hideSuggestions(){
      const box = $("suggestions");
      box.setAttribute("aria-expanded","false");
      box.innerHTML="";
    }

    // ---------- Search logic (supports dept->building + dean chooser) ----------
    function localLookupAndGo(qRaw){
      const q = norm(qRaw);
      if(!q){ showStatus("Type a building name to search."); return true; }

      // Generic "dean's office" => open chooser
      const genericDean = /\bdean'?s?\b.*\boffice\b/.test(q) &&
                          !/\b(ecs|engineering|business|cob|nsm|science|mathematics|arts|letters|education|hhs|ssis|cce)\b/.test(q);
      if (genericDean) {
        $("deptPanelTitle").textContent = "Dean’s Offices";
        openDeptPanel("Dean’s Offices", { mode:"dean-chooser" });
        showStatus("Select a dean’s office from the list.");
        saveRecent("Dean’s Office");
        return true;
      }

      // Try building names (fuzzy)
      const keys = Object.keys(buildings);
      let best = null, bestScore = 0;
      keys.forEach(k=>{
        const s = score(q,k);
        if(s>bestScore){ bestScore = s; best = k; }
      });

      if(best && bestScore >= 0.62){
        const {lat,lng} = buildings[best];
        const title = titleize(best);
        lastDeptContext = null;
        dropMarkerAt({lat,lng}, title);
        saveRecent(best);
        listMatchesAround(myLocation || sacCenter, best);
        return true;
      }

      // Department/office reverse lookup
      const dHit = findBuildingByDepartment(q);
      if (dHit){
        if (dHit.mode === "dean-chooser"){
          $("deptPanelTitle").textContent = "Dean’s Offices";
          openDeptPanel("Dean’s Offices", { mode:"dean-chooser" });
          showStatus("Select a dean’s office from the list.");
          saveRecent("Dean’s Office");
          return true;
        }

        const { buildingKey, floor, matchLabel, hours } = dHit;
        const coords = buildings[buildingKey];
        if (coords){
          const title = titleize(buildingKey);
          lastDeptContext = { matchedDept: matchLabel, floor, hours };
          dropMarkerAt(coords, title);
          const extra = floor ? ` — ${floor}` : "";
          showStatus(`${matchLabel}${extra} is in ${title}.`);
          saveRecent(matchLabel);
          listMatchesAround(coords, buildingKey);
          return true;
        } else {
          showStatus(`We found ${matchLabel}, but don’t have a map pin for ${titleize(buildingKey)} yet.`);
          return true;
        }
      }

      // Not found locally; allow Places fallback
      return false;
    }

    // ---------- Places search ----------
    function doSearch(){
      const input = $("searchInput");
      const q = input.value.trim();
      if(localLookupAndGo(q)) return;

      if (!google?.maps?.places || !google.maps.places.PlacesService) {
        showStatus("Not in local data, and Google Places isn’t available. Enable the Places API or add this to the local directory.");
        return;
      }

      try {
        const svc = new google.maps.places.PlacesService(map);
        svc.textSearch(
          { query: q + " Sacramento State", location: sacCenter, radius: 1500 },
          (results, status) => {
            try {
              if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length){
                const best = results
                  .map(r=>({
                    r,
                    d2: Math.pow(r.geometry?.location?.lat?.() - sacCenter.lat,2) +
                        Math.pow(r.geometry?.location?.lng?.() - sacCenter.lng,2)
                  }))
                  .filter(x => x.r?.geometry?.location)
                  .sort((a,b)=>a.d2-b.d2)[0]?.r;

                if (!best) { showStatus("No usable location found from Places."); return; }
                lastDeptContext = null;
                dropMarkerAt(best.geometry.location, best.name);
                saveRecent(best.name);
              } else {
                showStatus("Not found in local data or Places.");
              }
            } catch (innerErr) {
              console.error("Places callback error:", innerErr);
              showStatus("We hit an error reading Places results. (Console has details.)");
            }
          }
        );
      } catch (err) {
        console.error("Places call failed:", err);
        showStatus("Couldn’t contact Google Places. Check that the Places API is enabled for your key.");
      }
    }

    // Error guards
    window.addEventListener("error", (e)=>{
      console.error("Global error:", e.error || e.message);
      showStatus("Oops—something went wrong. Check the browser console for details.");
    });
    window.addEventListener("unhandledrejection", (e)=>{
      console.error("Unhandled promise rejection:", e.reason);
      showStatus("A request failed unexpectedly. Check the console for details.");
    });

    // Expose initMap globally for the callback
    window.initMap = initMap;
  </script>
