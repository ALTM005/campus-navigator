<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SearchMyCampus</title>
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; background-color: #f7f8fa; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #043927; color: white; padding: 10px 20px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 10;
    }
    .left-section { display: flex; align-items: center; gap: 10px; }
    .left-section img { height: 60px; width: auto; border-radius: 5px; }
    .left-section h1 { font-size: 1.8rem; margin: 0; color: white; white-space: nowrap; }
    #search-bar { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    #searchInput {
      width: 60%; min-width: 260px; padding: 10px 12px;
      border: 2px solid #ccc; border-radius: 10px; font-size: 1rem; color: #222; background: #fff;
    }
    #searchBtn {
      padding: 10px 15px; background-color: #00573f; color: white; border: none;
      border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    #searchBtn:hover { background-color: #007a55; }
    #map {
      height: 520px; width: 90%; margin: 20px auto; border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1); background: #eaeaea;
    }
    #info-box {
      width: 80%; margin: 20px auto; background-color: #ffffff; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 20px;
    }
    #info-box h2 { color: #043927; margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <div class="left-section">
      <a href="https://www.csus.edu" target="_blank" rel="noopener">
        <img src="sacstate_logo.jpeg" alt="Sac State Logo" />
      </a>
      <h1>SearchMyCampus</h1>
    </div>

    <div id="search-bar">
      <input type="text" id="searchInput" placeholder="Search Sac State buildings…" />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <div id="map"></div>

  <section id="info-box">
    <h2>Building Information</h2>
    <p id="buildingInfo">Type a building name (e.g., “Amador Hall”, “Library”, “Riverside Hall”) and press Search.</p>
  </section>

  <!-- Google Maps JS (replace YOUR_API_KEY) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDBfcMgy26bXXA7fLNCAcDkeqUqBUSVlqs&libraries=places&callback=initMap" async defer></script>

  <script>
    // ---------- Globals ----------
    let map, marker;
    const sacCenter = { lat: 38.561, lng: -121.424 };

    // ---------- Local Buildings (lat/lng) ----------
    // Notes:
    // - Names are lowercased. Search is case-insensitive and supports partial matches.
    // - Coordinates are best-effort and close; you can refine by clicking the map (see click listener).
    const buildings = {
      // Academic & admin halls
      "alpine hall":        { lat: 38.5609, lng: -121.4240 },
      "amador hall":        { lat: 38.5600, lng: -121.4227 },
      "benicia hall":       { lat: 38.5592, lng: -121.4229 },
      "brighton hall":      { lat: 38.5595, lng: -121.4224 },
      "calaveras hall":     { lat: 38.5590, lng: -121.4235 },
      "del norte hall":     { lat: 38.5597, lng: -121.4219 },
      "desmond hall":       { lat: 38.5604, lng: -121.4209 },
      "draper hall":        { lat: 38.5609, lng: -121.4238 },
      "eureka hall":        { lat: 38.5598, lng: -121.4214 },
      "folsom hall":        { lat: 38.5529, lng: -121.4253 },  // off main quad (65th St)
      "humboldt hall":      { lat: 38.5601, lng: -121.4261 },
      "jenkins hall":       { lat: 38.5612, lng: -121.4252 },
      "kadema hall":        { lat: 38.5602, lng: -121.4233 },
      "lassen hall":        { lat: 38.5596, lng: -121.4239 },
      "mariposa hall":      { lat: 38.5603, lng: -121.4226 },
      "mendocino hall":     { lat: 38.5609, lng: -121.4229 },
      "modoc hall":         { lat: 38.5613, lng: -121.4217 },
      "napa hall":          { lat: 38.5616, lng: -121.4221 },
      "placer hall":        { lat: 38.5614, lng: -121.4281 },
      "sacramento hall":    { lat: 38.5606, lng: -121.4239 },
      "sequoia hall":       { lat: 38.5594, lng: -121.4248 },
      "shasta hall":        { lat: 38.5598, lng: -121.4250 },
      "sierra hall":        { lat: 38.5591, lng: -121.4243 },
      "solano hall":        { lat: 38.5590, lng: -121.4253 },
      "tahoe hall":         { lat: 38.5610, lng: -121.4236 },
      "yosemite hall":      { lat: 38.5597, lng: -121.4266 },
      "santa clara hall":   { lat: 38.5608, lng: -121.4254 },
      "klamath hall":       { lat: 38.5605, lng: -121.4219 },

      // Common non-"hall" buildings users search
      "university library": { lat: 38.5605, lng: -121.4245 },
      "library":            { lat: 38.5605, lng: -121.4245 }, // alias
      "university union":   { lat: 38.5593, lng: -121.4231 },
      "riverside hall":     { lat: 38.5618, lng: -121.4243 },
      "the well":           { lat: 38.5579, lng: -121.4259 },
      "hornet stadium":     { lat: 38.5589, lng: -121.4285 },
      "guy west bridge":    { lat: 38.5641, lng: -121.4232 },

      // Student services, housing, dining, bookstore
      "student health center": { lat: 38.5591, lng: -121.4214 },
      "dining commons":        { lat: 38.5607, lng: -121.4260 },
      "hornet bookstore":      { lat: 38.5589, lng: -121.4229 },
      "american river courtyard": { lat: 38.5621, lng: -121.4258 },
      "riverview hall":        { lat: 38.5628, lng: -121.4252 },
      "desmond hall housing":  { lat: 38.5604, lng: -121.4209 }, // alias for housing
      "hornet commons":        { lat: 38.5497, lng: -121.4168 },

      // Parking structures & notable lots (handy for navigation)
      "parking structure 1": { lat: 38.5629, lng: -121.4207 },
      "parking structure 2": { lat: 38.5597, lng: -121.4196 },
      "parking structure 3": { lat: 38.5569, lng: -121.4214 },
      "parking structure 4": { lat: 38.5577, lng: -121.4270 },
      "parking structure 5": { lat: 38.5621, lng: -121.4280 },
      "parking structure 6": { lat: 38.5543, lng: -121.4188 }
    };

    // ---------- Helpers ----------
    function norm(s) { return (s || "").toLowerCase().replace(/\s+/g, " ").trim(); }

    function dropMarkerAt(pos, title) {
      if (marker) marker.setMap(null);
      marker = new google.maps.Marker({ position: pos, map, title });
      map.panTo(pos);
      map.setZoom(18);
      document.getElementById("buildingInfo").innerHTML = `<strong>${title}</strong>`;
    }

    function showStatus(msg) {
      console.log("[SearchMyCampus]", msg);
      document.getElementById("buildingInfo").textContent = msg;
    }

    // ---------- Init Map ----------
    function initMap() {
      const appleStyle = [
        { elementType: 'geometry', stylers: [{ color: '#f5f5f5' }] },
        { elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#616161' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#f5f5f5' }] },
        { featureType: 'administrative.land_parcel', stylers: [{ visibility: 'off' }] },
        { featureType: 'poi', stylers: [{ visibility: 'off' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
        { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#dadada' }] },
        { featureType: 'transit', stylers: [{ visibility: 'off' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#c9e6ff' }] }
      ];

      map = new google.maps.Map(document.getElementById("map"), {
        center: sacCenter,
        zoom: 16,
        styles: appleStyle,
        mapTypeControl: false,
        disableDefaultUI: false,
        restriction: {
          latLngBounds: {
            north: 38.568, south: 38.551, west: -121.435, east: -121.415
          },
          strictBounds: false
        }
      });

      const input = document.getElementById("searchInput");
      const btn = document.getElementById("searchBtn");

      // Click to grab coordinates (for fine-tuning)
      map.addListener('click', (e) => {
        console.log('Clicked at:', e.latLng.lat(), e.latLng.lng());
      });

      function localLookupAndGo(qRaw) {
        const q = norm(qRaw);
        if (!q) { showStatus("Type a building name to search."); return true; }

        // 1) exact match, 2) startsWith, 3) includes
        const keys = Object.keys(buildings);
        const exact   = keys.find(k => k === q);
        const starts  = keys.find(k => k.startsWith(q));
        const partial = keys.find(k => k.includes(q));
        const keyHit  = exact || starts || partial;

        if (keyHit) {
          const { lat, lng } = buildings[keyHit];
          dropMarkerAt({ lat, lng }, keyHit.replace(/\b\w/g, c => c.toUpperCase()));
          return true; // handled locally
        }
        return false; // not found locally
      }

      // Search button handler: local first, then Places textSearch fallback
      btn.addEventListener("click", () => {
        const q = input.value.trim();
        if (localLookupAndGo(q)) return;

        // Fallback to Places Text Search (requires Places API enabled)
        const svc = new google.maps.places.PlacesService(map);
        svc.textSearch(
          { query: q + " Sacramento State", location: sacCenter, radius: 1500 },
          (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length) {
              const best = results
                .map(r => ({
                  r,
                  d2: Math.pow(r.geometry.location.lat() - sacCenter.lat, 2) +
                      Math.pow(r.geometry.location.lng() - sacCenter.lng, 2)
                }))
                .sort((a,b) => a.d2 - b.d2)[0].r;

              dropMarkerAt(best.geometry.location, best.name);
            } else {
              showStatus("Not found. Try another name or refine your spelling.");
            }
          }
        );
      });

      // Also trigger search on Enter
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") btn.click();
      });
    }
  </script>
</body>
</html>
